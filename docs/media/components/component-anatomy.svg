<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="title desc"><title id="title">Properties, events and functions of a component</title><desc id="desc">An Input named Input1, with its three kinds of member. Properties such as Text, Hint Text and Enabled appear in the properties panel at design time and as set and get blocks in your logic: set Input1.Text to, and Input1.Text. Events such as Text Changed, Submit and Focus are hat blocks, like when Input1.Submit do, where logic starts; the blocks inside run each time the event fires. Functions such as Request Focus and Clear Focus are call blocks, like call Input1.Request Focus, that you run from any event handler.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="432" fill="#ffffff"/><rect x="24" y="24" width="272" height="384" rx="14" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="44" y="56" font-size="17" font-weight="700" fill="#111014" class="m">Input1</text><text x="44" y="77" font-size="13" fill="#5f5e62">An Input on a screen</text><rect x="44" y="92" width="232" height="38" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="60" y="116" font-size="14" fill="#5f5e62">Email</text><text x="44" y="164" font-size="13" font-weight="700" fill="#483faa">Properties</text><text x="44" y="186" font-size="14" fill="#2f2f2f">Text · Hint Text · Enabled</text><path d="M44,218 L276,218" stroke="#6e66cc" stroke-width="1" fill="none"/><text x="44" y="258" font-size="13" font-weight="700" fill="#483faa">Events</text><text x="44" y="280" font-size="14" fill="#2f2f2f">Text Changed · Submit · Focus</text><path d="M44,312 L276,312" stroke="#6e66cc" stroke-width="1" fill="none"/><text x="44" y="352" font-size="13" font-weight="700" fill="#483faa">Functions</text><text x="44" y="374" font-size="14" fill="#2f2f2f">Request Focus · Clear Focus</text><path d="M296,174 L338,174" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><text x="340" y="118" font-size="13" font-weight="600" fill="#5f5e62">At design time</text><rect x="340" y="130" width="214" height="84" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="354" y="153" font-size="13" font-weight="700" fill="#111014">Properties panel</text><text x="354" y="180" font-size="13" fill="#5f5e62">Text</text><rect x="434" y="166" width="106" height="22" rx="5" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="354" y="204" font-size="13" fill="#5f5e62">Hint</text><rect x="434" y="190" width="106" height="22" rx="5" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="444" y="205" font-size="13" fill="#2f2f2f">Email</text><text x="578" y="118" font-size="13" font-weight="600" fill="#5f5e62">In your logic</text><path d="M584,132 H590 l5,5 h12 l5,-5 H810 Q816,132 816,138 V160 Q816,166 810,166 H612 l-5,5 h-12 l-5,-5 H584 Q578,166 578,160 V138 Q578,132 584,132 Z" fill="#483faa"/><text x="592" y="154" font-size="14" font-weight="600" fill="#ffffff">set Input1.Text to</text><rect x="766" y="138" width="40" height="22" rx="5" fill="#ffffff"/><path d="M590,182 H698 Q704,182 704,188 V206 Q704,212 698,212 H590 Q584,212 584,206 V204 h-6 v-14 h6 V188 Q584,182 590,182 Z" fill="#483faa"/><text x="596" y="202" font-size="14" font-weight="600" fill="#ffffff">Input1.Text</text><path d="M296,268 L338,268" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><path d="M348,251 H582 Q590,251 590,259 V277 Q590,285 582,285 H380 V317 H437 Q445,317 445,325 V327 Q445,335 437,335 H348 Q340,335 340,327 V259 Q340,251 348,251 Z" fill="#322c7d"/><text x="354" y="273" font-size="14" font-weight="600" fill="#ffffff">when Input1.Submit</text><text x="352" y="307" font-size="14" font-weight="600" fill="#ffffff">do</text><rect x="388" y="291" width="170" height="24" rx="5" fill="#ffffff" stroke="#6e66cc" stroke-width="1.5" stroke-dasharray="4 3"/><text x="400" y="308" font-size="13" fill="#5f5e62">your blocks</text><text x="620" y="270" font-size="13" fill="#5f5e62">Logic starts here: the blocks</text><text x="620" y="289" font-size="13" fill="#5f5e62">inside run each time it fires</text><path d="M296,366 L338,366" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><path d="M346,349 H352 l5,5 h12 l5,-5 H598 Q604,349 604,355 V377 Q604,383 598,383 H374 l-5,5 h-12 l-5,-5 H346 Q340,383 340,377 V355 Q340,349 346,349 Z" fill="#6e66cc"/><text x="354" y="371" font-size="14" font-weight="600" fill="#ffffff">call Input1.Request Focus</text><text x="632" y="362" font-size="13" fill="#5f5e62">Run it from any</text><text x="632" y="381" font-size="13" fill="#5f5e62">event handler</text></svg>
