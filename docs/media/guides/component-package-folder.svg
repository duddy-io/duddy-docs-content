<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="title desc"><title id="title">What a marketplace component folder holds</title><desc id="desc">A component folder, MyWidget, holds: duddy-package.json, required, with the version, price, permissions and libraries; preview.svg, required, the 24 by 24 palette icon; android/src/io/duddy/components/MyWidget.java, required, which defines the component; android/lib, optional, for your .jar and .aar files; ios/src/MyWidgetModule.swift, optional, the iOS half; web/src/MyWidget.jsx, optional, the web half in React; and .duddy-build, written by duddy build. The Java file defines every property, event and function, and the iOS and web halves are checked against it.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="452" fill="#ffffff"/><rect x="24" y="20" width="912" height="360" rx="14" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,64 V339" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,87 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,123 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,159 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,267 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,303 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M55,339 H70" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M81,172 V231" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M81,195 H96" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><path d="M81,231 H96" fill="none" stroke="#c8c5d0" stroke-width="1.5"/><text x="48" y="56" font-size="14" font-weight="700" fill="#5f5e62" class="m">MyWidget/</text><text x="74" y="92" font-size="14" font-weight="700" fill="#111014" class="m">duddy-package.json</text><text x="540" y="92" font-size="13.5" fill="#2f2f2f">Version, price, permissions, libraries</text><rect x="830" y="75" width="86" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="873" y="91.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Required</text><text x="74" y="128" font-size="14" font-weight="700" fill="#111014" class="m">preview.svg</text><text x="540" y="128" font-size="13.5" fill="#2f2f2f">24 × 24 palette icon</text><rect x="830" y="111" width="86" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="873" y="127.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Required</text><text x="74" y="164" font-size="14" font-weight="700" fill="#5f5e62" class="m">android/</text><text x="100" y="200" font-size="14" font-weight="700" fill="#111014" class="m">src/io/duddy/components/MyWidget.java</text><text x="540" y="200" font-size="13.5" fill="#2f2f2f">Defines the component</text><rect x="830" y="183" width="86" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="873" y="199.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Required</text><text x="100" y="236" font-size="14" font-weight="500" fill="#111014" class="m">lib/</text><text x="540" y="236" font-size="13.5" fill="#2f2f2f">Your .jar and .aar files</text><rect x="830" y="219" width="86" height="24" rx="12" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="873" y="235.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Optional</text><text x="74" y="272" font-size="14" font-weight="500" fill="#111014" class="m">ios/src/MyWidgetModule.swift</text><text x="540" y="272" font-size="13.5" fill="#2f2f2f">The iOS half</text><rect x="830" y="255" width="86" height="24" rx="12" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="873" y="271.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Optional</text><text x="74" y="308" font-size="14" font-weight="500" fill="#111014" class="m">web/src/MyWidget.jsx</text><text x="540" y="308" font-size="13.5" fill="#2f2f2f">The web half, in React</text><rect x="830" y="291" width="86" height="24" rx="12" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="873" y="307.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Optional</text><text x="74" y="344" font-size="14" font-weight="500" fill="#111014" class="m">.duddy-build</text><text x="540" y="344" font-size="13.5" fill="#2f2f2f">Written by duddy build</text><rect x="830" y="327" width="86" height="24" rx="12" fill="#ffffff" stroke="#a4a1a6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="873" y="343.68" font-size="13" font-weight="600" fill="#5f5e62" text-anchor="middle">Created</text><rect x="24" y="396" width="912" height="40" rx="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="480" y="421" font-size="13.5" fill="#111014" text-anchor="middle">The Java file defines every property, event and function. The iOS and web halves are checked against it.</text></svg>
