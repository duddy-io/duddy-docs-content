<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 406" width="960" height="406" role="img" aria-labelledby="title desc"><title id="title">Fill, Auto, px and % sizes in a Row</title><desc id="desc">Two Rows. In the first, an Icon set to Auto and a Button set to Auto take only what their content needs, and a Title set to Fill takes the space that is left. In the second, an Auto Icon is followed by two Fill children, which share the space that is left equally. Auto is as big as its content; Fill shares what is left along the container's direction and takes the full size across it; px is a fixed size; % is a share of the parent's inside, after its padding.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="406" fill="#1d1c20"/><text x="24" y="92" font-size="14" font-weight="700" fill="#f1f1f1">One Fill</text><text x="24" y="112" font-size="13" fill="#a4a1a6">takes the rest</text><rect x="168" y="58" width="744" height="76" rx="12" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><rect x="180" y="70" width="64" height="52" rx="8" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="212" y="92" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Icon</text><text x="212" y="112" font-size="13" fill="#a4a1a6" text-anchor="middle">Auto</text><rect x="256" y="70" width="504" height="52" rx="8" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="508" y="92" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Title</text><text x="508" y="112" font-size="13" font-weight="700" fill="#b4abe4" text-anchor="middle">Fill</text><rect x="772" y="70" width="128" height="52" rx="8" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="836" y="92" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Button</text><text x="836" y="112" font-size="13" fill="#a4a1a6" text-anchor="middle">Auto</text><path d="M266,46 L750,46" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)" marker-start="url(#s-accent)"/><text x="508" y="38" font-size="13" fill="#b4abe4" text-anchor="middle">the space Icon and Button leave</text><text x="24" y="240" font-size="14" font-weight="700" fill="#f1f1f1">Two Fills</text><text x="24" y="260" font-size="13" fill="#a4a1a6">share it equally</text><rect x="168" y="206" width="744" height="76" rx="12" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><rect x="180" y="218" width="64" height="52" rx="8" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="212" y="240" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Icon</text><text x="212" y="260" font-size="13" fill="#a4a1a6" text-anchor="middle">Auto</text><rect x="256" y="218" width="316" height="52" rx="8" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="414" y="240" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Title</text><text x="414" y="260" font-size="13" font-weight="700" fill="#b4abe4" text-anchor="middle">Fill</text><rect x="584" y="218" width="316" height="52" rx="8" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="742" y="240" font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">Price</text><text x="742" y="260" font-size="13" font-weight="700" fill="#b4abe4" text-anchor="middle">Fill</text><path d="M266,194 L562,194" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)" marker-start="url(#s-accent)"/><path d="M594,194 L890,194" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)" marker-start="url(#s-accent)"/><text x="414" y="186" font-size="13" fill="#b4abe4" text-anchor="middle">half</text><text x="742" y="186" font-size="13" fill="#b4abe4" text-anchor="middle">half</text><rect x="24" y="312" width="219" height="78" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="40" y="336" font-size="15" font-weight="700" fill="#b4abe4">Auto</text><text x="90" y="336" font-size="13" fill="#ccc8cf">As big as its content</text><rect x="255" y="312" width="219" height="78" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="271" y="336" font-size="15" font-weight="700" fill="#b4abe4">Fill</text><text x="321" y="336" font-size="13" fill="#ccc8cf">Shares what is left</text><text x="321" y="354" font-size="13" fill="#ccc8cf">along the Row; full</text><text x="321" y="372" font-size="13" fill="#ccc8cf">size across it</text><rect x="486" y="312" width="219" height="78" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="502" y="336" font-size="15" font-weight="700" fill="#b4abe4">px</text><text x="552" y="336" font-size="13" fill="#ccc8cf">A fixed size</text><rect x="717" y="312" width="219" height="78" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="733" y="336" font-size="15" font-weight="700" fill="#b4abe4">%</text><text x="783" y="336" font-size="13" fill="#ccc8cf">A share of the</text><text x="783" y="354" font-size="13" fill="#ccc8cf">parent's inside,</text><text x="783" y="372" font-size="13" fill="#ccc8cf">after its padding</text></svg>
