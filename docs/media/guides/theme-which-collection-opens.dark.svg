<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="title desc"><title id="title">Which theme collection a screen opens in</title><desc id="desc">When a screen opens: if the app has switched theme from logic, it uses that theme, for the whole app. If not, and the phone is in dark mode and there is a collection named Dark, it uses Dark. Otherwise it uses Default. Setting a theme name that has no collection changes nothing.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="318" fill="#1d1c20"/><rect x="24" y="52" width="150" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="99" y="85.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">A screen</text><text x="99" y="105.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">opens</text><path d="M174,90 L210,90" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="210" y="44" width="236" height="92" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="328" y="85.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Has the app switched</text><text x="328" y="105.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">theme from logic?</text><path d="M446,90 L494,90" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="470" y="80" font-size="13" font-weight="700" fill="#a4a1a6" text-anchor="middle">No</text><rect x="494" y="36" width="262" height="108" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="625" y="75.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Is the phone in dark mode,</text><text x="625" y="95.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">and is there a collection</text><text x="625" y="115.4" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">named Dark?</text><path d="M756,90 L800,90" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="778" y="80" font-size="13" font-weight="700" fill="#a4a1a6" text-anchor="middle">No</text><rect x="800" y="52" width="136" height="76" rx="10" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="868" y="95.76" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Default</text><path d="M328,136 L328,196" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="338" y="172" font-size="13" font-weight="700" fill="#a4a1a6">Yes</text><rect x="210" y="196" width="236" height="76" rx="10" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="328" y="228.26" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">That theme</text><text x="328" y="251.68" font-size="13" fill="#e1deff" text-anchor="middle">for the whole app</text><path d="M625,144 L625,196" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="635" y="176" font-size="13" font-weight="700" fill="#a4a1a6">Yes</text><rect x="494" y="196" width="262" height="76" rx="10" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="625" y="239.76" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Dark</text><text x="480" y="304" font-size="13" fill="#a4a1a6" text-anchor="middle">Setting a theme name that has no collection changes nothing.</text></svg>
