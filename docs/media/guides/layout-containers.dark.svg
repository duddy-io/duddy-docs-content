in Stack</text><text x="516" y="349" font-size="13" fill="#a4a1a6">Nine positions</text><text x="516" y="374" font-size="13" font-weight="700" fill="#f1f1f1">Fill</text><text x="516" y="393" font-size="13" fill="#a4a1a6">Covers the whole box</text><text x="744" y="330" font-size="13" font-weight="700" fill="#f1f1f1">Scrolls up and down</text><text x="744" y="349" font-size="13" fill="#a4a1a6">when children overflow</text><text x="744" y="374" font-size="13" font-weight="700" fill="#f1f1f1">Screens don't scroll</text><text x="744" y="393" font-size="13" fill="#a4a1a6">Wrap long content in one</text></svg>
