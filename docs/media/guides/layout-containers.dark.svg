<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-labelledby="title desc"><title id="title">How Column, Row, Stack and ScrollableColumn place children</title><desc id="desc">Column puts its children top to bottom: Arrange Children sets Top, Middle or Bottom, and each child's Position in Column sets Left, Center or Right. Row puts them side by side: Arrange Children sets Left, Center or Right, and each child's Position in Row sets Top, Middle or Bottom. Stack layers them: each child has one of nine Positions in Stack, and a Fill child covers the whole box. ScrollableColumn scrolls when its children are taller than it; a screen does not scroll by itself.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="408" fill="#1d1c20"/><text x="138" y="40" font-size="16" font-weight="700" fill="#f1f1f1" text-anchor="middle">Column</text><text x="138" y="60" font-size="13" fill="#a4a1a6" text-anchor="middle">Top to bottom</text><text x="366" y="40" font-size="16" font-weight="700" fill="#f1f1f1" text-anchor="middle">Row</text><text x="366" y="60" font-size="13" fill="#a4a1a6" text-anchor="middle">Side by side</text><text x="594" y="40" font-size="16" font-weight="700" fill="#f1f1f1" text-anchor="middle">Stack</text><text x="594" y="60" font-size="13" fill="#a4a1a6" text-anchor="middle">Layered</text><text x="822" y="40" font-size="16" font-weight="700" fill="#f1f1f1" text-anchor="middle">ScrollableColumn</text><text x="822" y="60" font-size="13" fill="#a4a1a6" text-anchor="middle">Scrolls when it overflows</text><rect x="60" y="80" width="156" height="196" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><rect x="76" y="94" width="104" height="46" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="128" y="122" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">1</text><rect x="76" y="155" width="104" height="46" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="128" y="183" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">2</text><rect x="76" y="216" width="104" height="46" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="128" y="244" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">3</text><path d="M198,98 L198,258" fill="none" stroke="#b4abe4" stroke-width="2" marker-end="url(#m-accent)"/><rect x="270" y="130" width="192" height="96" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><rect x="284" y="146" width="48" height="64" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="308" y="183" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">1</text><rect x="342" y="146" width="48" height="64" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="366" y="183" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">2</text><rect x="400" y="146" width="48" height="64" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="424" y="183" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">3</text><path d="M288,244 L444,244" fill="none" stroke="#b4abe4" stroke-width="2" marker-end="url(#m-accent)"/><rect x="516" y="80" width="156" height="196" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><rect x="530" y="94" width="128" height="168" rx="8" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="544" y="120" font-size="14" font-weight="600" fill="#b4abe4">1  Fill</text><rect x="552" y="160" width="84" height="50" rx="7" fill="#1d1c20" stroke="#6e66cc" stroke-width="1.5"/><text x="594" y="190" font-size="14" font-weight="600" fill="#b4abe4" text-anchor="middle">2</text><rect x="632" y="82" width="34" height="34" rx="17" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="6