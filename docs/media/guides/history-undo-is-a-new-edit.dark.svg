<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc"><title id="title">Undo this change adds a new edit</title><desc id="desc">A timeline of changes A, B and C. Choosing Undo this change on B adds a new edit after C that reverses B. Change C, made later, is kept, and the undo can itself be undone. It is not a rewind: nothing after B is thrown away.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="300" fill="#1d1c20"/><path d="M40,196 L930,196" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="40" y="224" font-size="13" fill="#a4a1a6">Time</text><rect x="112" y="104" width="156" height="60" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="190" y="127.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Change A</text><text x="190" y="151.18" font-size="13" fill="#a4a1a6" text-anchor="middle">by you</text><path d="M190,164 L190,188" stroke="#555555" stroke-width="1.5" fill="none"/><circle cx="190" cy="196" r="7" fill="#1d1c20" stroke="#adaaaf" stroke-width="2"/><rect x="302" y="104" width="156" height="60" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="380" y="127.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Change B</text><text x="380" y="151.18" font-size="13" fill="#a4a1a6" text-anchor="middle">by a teammate</text><path d="M380,164 L380,188" stroke="#555555" stroke-width="1.5" fill="none"/><circle cx="380" cy="196" r="7" fill="#1d1c20" stroke="#adaaaf" stroke-width="2"/><rect x="492" y="104" width="156" height="60" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="570" y="127.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Change C</text><text x="570" y="151.18" font-size="13" fill="#a4a1a6" text-anchor="middle">by you</text><path d="M570,164 L570,188" stroke="#555555" stroke-width="1.5" fill="none"/><circle cx="570" cy="196" r="7" fill="#1d1c20" stroke="#adaaaf" stroke-width="2"/><rect x="702" y="104" width="156" height="60" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="780" y="127.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Undo of B</text><text x="780" y="151.18" font-size="13" fill="#a4a1a6" text-anchor="middle">a new edit</text><path d="M780,164 L780,188" stroke="#555555" stroke-width="1.5" fill="none"/><circle cx="780" cy="196" r="7" fill="#483faa" stroke="#483faa" stroke-width="2"/><path d="M380,104 C380,48 780,48 780,98" fill="none" stroke="#b4abe4" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M780,92 L780,104" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="492" y="40" width="176" height="28" rx="10" fill="#1d1c20"/><text x="580" y="60" font-size="14" font-weight="700" fill="#b4abe4" text-anchor="middle">Undo this change</text><rect x="543.5" y="214" width="53" height="24" rx="12" fill="#1a2d25" stroke="#00c951" stroke-width="1.5"/><text x="570" y="230.68" font-size="13" font-weight="600" fill="#7bf1a8" text-anchor="middle">Kept</text><rect x="702.5" y="214" width="155" height="24" rx="12" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="780" y="230.68" font-size="13" font-weight="600" fill="#f1f1f1" text-anchor="middle">Can be undone too</text><text x="480" y="282" font-size="13.5" fill="#a4a1a6" text-anchor="middle">Not a rewind: nothing after B is thrown away.</text></svg>
