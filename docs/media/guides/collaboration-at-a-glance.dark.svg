<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="title desc"><title id="title">Working on one project together</title><desc id="desc">Four things keep people out of each other's way. Who is here: avatars in the header show who has the project open, and in the block editor you see each other's cursors. Locks: a component someone has selected is locked to them until they move on, so nobody else can change it meanwhile. Comments: a comment belongs to the screen you post it on, and marking it resolved deletes it. History: every change is listed, and Undo this change reverses one change as a new edit while keeping later work.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="404" fill="#1d1c20"/><rect x="24" y="24" width="444" height="166" rx="14" fill="#28272b" stroke="#555555" stroke-width="1.5"/><rect x="40" y="40" width="150" height="134" rx="10" fill="#2a2645"/><text x="210" y="68" font-size="16" font-weight="700" fill="#f1f1f1">See who's here</text><text x="210" y="94" font-size="13.5" fill="#ccc8cf">Avatars in the header show who</text><text x="210" y="114" font-size="13.5" fill="#ccc8cf">has the project open. In the</text><text x="210" y="134" font-size="13.5" fill="#ccc8cf">block editor you see each other's</text><text x="210" y="154" font-size="13.5" fill="#ccc8cf">cursors.</text><rect x="492" y="24" width="444" height="166" rx="14" fill="#28272b" stroke="#555555" stroke-width="1.5"/><rect x="508" y="40" width="150" height="134" rx="10" fill="#2a2645"/><text x="678" y="68" font-size="16" font-weight="700" fill="#f1f1f1">Selection locks</text><text x="678" y="94" font-size="13.5" fill="#ccc8cf">A component someone has</text><text x="678" y="114" font-size="13.5" fill="#ccc8cf">selected is locked to them until</text><text x="678" y="134" font-size="13.5" fill="#ccc8cf">they move on, so two people</text><text x="678" y="154" font-size="13.5" fill="#ccc8cf">never change it at once.</text><rect x="24" y="214" width="444" height="166" rx="14" fill="#28272b" stroke="#555555" stroke-width="1.5"/><rect x="40" y="230" width="150" height="134" rx="10" fill="#2a2645"/><text x="210" y="258" font-size="16" font-weight="700" fill="#f1f1f1">Comments</text><text x="210" y="284" font-size="13.5" fill="#ccc8cf">A comment belongs to the</text><text x="210" y="304" font-size="13.5" fill="#ccc8cf">screen you post it on. Marking</text><text x="210" y="324" font-size="13.5" fill="#ccc8cf">it resolved deletes it.</text><rect x="492" y="214" width="444" height="166" rx="14" fill="#28272b" stroke="#555555" stroke-width="1.5"/><rect x="508" y="230" width="150" height="134" rx="10" fill="#2a2645"/><text x="678" y="258" font-size="16" font-weight="700" fill="#f1f1f1">History</text><text x="678" y="284" font-size="13.5" fill="#ccc8cf">Every change is listed. Undo</text><text x="678" y="304" font-size="13.5" fill="#ccc8cf">this change reverses one change</text><text x="678" y="324" font-size="13.5" fill="#ccc8cf">as a new edit and keeps the</text><text x="678" y="344" font-size="13.5" fill="#ccc8cf">work that came after it.</text><circle cx="74" cy="74" r="15" fill="#483faa" stroke="#2a2645" stroke-width="2.5"/><text x="74" y="79" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><circle cx="100" cy="74" r="15" fill="#322c7d" stroke="#2a2645" stroke-width="2.5"/><text x="100" y="79" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><circle cx="126" cy="74" r="15" fill="#6e66cc" stroke="#2a2645" stroke-width="2.5"/><text x="126" y="79" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><circle cx="139" cy="86" r="5" fill="#00c951" stroke="#2a2645" stroke-width="2"/><rect x="54" y="112" width="84" height="26" rx="5" fill="#483faa"/><rect x="62" y="121" width="40" height="8" rx="4" fill="#ffffff"/><path d="M130,128 l0,18 l5,-5 l4,8 l3,-1.5 l-4,-8 l7,0 z" fill="#6e66cc" stroke="#1d1c20" stroke-width="1.2"/><rect x="136" y="146" width="28" height="22" rx="11" fill="#322c7d" stroke="#322c7d" stroke-width="1.5"/><text x="150" y="161.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">B</text><rect x="526" y="86" width="114" height="40" rx="8" fill="#1d1c20" stroke="#483faa" stroke-width="2"/><rect x="536" y="100" width="64" height="12" rx="6" fill="#555555"/><rect x="526" y="56" width="70" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="561" y="72.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Sam</text><rect x="620" y="102.05" width="13.8" height="10.35" rx="2.3" fill="#b4abe4"/><path d="M623.45,102.05 V98.6 a3.4499999999999997,3.4499999999999997 0 0 1 6.8999999999999995,0 V102.05" fill="none" stroke="#b4abe4" stroke-width="1.84"/><text x="583" y="152" font-size="13" font-weight="600" fill="#b4abe4" text-anchor="middle">Locked to Sam</text><rect x="52" y="248" width="126" height="66" rx="10" fill="#1d1c20" stroke="#555555" stroke-width="1.5"/><path d="M74,314 l0,14 l14,-14 z" fill="#1d1c20"/><path d="M74,314 L74,328" stroke="#555555" stroke-width="1.5" fill="none"/><path d="M74,328 L88,314" stroke="#555555" stroke-width="1.5" fill="none"/><rect x="64" y="262" width="100" height="8" rx="4" fill="#555555"/><rect x="64" y="278" width="72" height="8" rx="4" fill="#555555"/><rect x="64" y="334" width="84" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="106" y="350.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">On Home</text><rect x="522" y="244" width="122" height="30" rx="7" fill="#1d1c20" stroke="#555555" stroke-width="1.5"/><rect x="532" y="255" width="56" height="8" rx="4" fill="#555555"/><rect x="522" y="282" width="122" height="30" rx="7" fill="#1d1c20" stroke="#4