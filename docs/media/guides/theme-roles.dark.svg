<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc"><title id="title">Theme roles, collections and the components that use them</title><desc id="desc">A theme has nine colour roles: primary, onPrimary, secondary, onSecondary, background, onBackground, sheet, neutral and icon. Every collection, such as Default and a Dark collection, has the same roles with its own colours; the Default colours of a new project are #4B1FA8, #FFFFFF, #ECDFFF, #21005D, #FFFFFF, #000000, #FAFAFA, #8A8598 and #444444, and the Dark column shows example colours. Component properties point at a role by default: Button Background at primary, Button Text Color at onPrimary, CardView Background at background, TextView Text Color at onBackground, Screen Background at sheet, Input Hint Color at neutral and Icon Color at icon.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="470" fill="#1d1c20"/><rect x="24" y="20" width="444" height="410" rx="14" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="44" y="52" font-size="13" font-weight="700" fill="#a4a1a6">Role</text><text x="214" y="52" font-size="13" font-weight="700" fill="#a4a1a6">Default</text><text x="334" y="52" font-size="13" font-weight="700" fill="#a4a1a6">Dark (example)</text><path d="M44,64 L448,64" stroke="#37363b" stroke-width="1" fill="none"/><text x="44" y="91" font-size="14" font-weight="600" fill="#f1f1f1" class="m">primary</text><rect x="214" y="74" width="24" height="24" rx="6" fill="#4B1FA8" stroke="#555555" stroke-width="1"/><text x="246" y="91" font-size="13" fill="#ccc8cf" class="m">#4B1FA8</text><rect x="334" y="74" width="24" height="24" rx="6" fill="#CFBCFF" stroke="#555555" stroke-width="1"/><text x="366" y="91" font-size="13" fill="#ccc8cf" class="m">#CFBCFF</text><text x="44" y="129" font-size="14" font-weight="600" fill="#f1f1f1" class="m">onPrimary</text><rect x="214" y="112" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="1"/><text x="246" y="129" font-size="13" fill="#ccc8cf" class="m">#FFFFFF</text><rect x="334" y="112" width="24" height="24" rx="6" fill="#381E72" stroke="#555555" stroke-width="1"/><text x="366" y="129" font-size="13" fill="#ccc8cf" class="m">#381E72</text><text x="44" y="167" font-size="14" font-weight="600" fill="#f1f1f1" class="m">secondary</text><rect x="214" y="150" width="24" height="24" rx="6" fill="#ECDFFF" stroke="#555555" stroke-width="1"/><text x="246" y="167" font-size="13" fill="#ccc8cf" class="m">#ECDFFF</text><rect x="334" y="150" width="24" height="24" rx="6" fill="#4A4458" stroke="#555555" stroke-width="1"/><text x="366" y="167" font-size="13" fill="#ccc8cf" class="m">#4A4458</text><text x="44" y="205" font-size="14" font-weight="600" fill="#f1f1f1" class="m">onSecondary</text><rect x="214" y="188" width="24" height="24" rx="6" fill="#21005D" stroke="#555555" stroke-width="1"/><text x="246" y="205" font-size="13" fill="#ccc8cf" class="m">#21005D</text><rect x="334" y="188" width="24" height="24" rx="6" fill="#E8DEF8" stroke="#555555" stroke-width="1"/><text x="366" y="205" font-size="13" fill="#ccc8cf" class="m">#E8DEF8</text><text x="44" y="243" font-size="14" font-weight="600" fill="#f1f1f1" class="m">background</text><rect x="214" y="226" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="1"/><text x="246" y="243" font-size="13" fill="#ccc8cf" class="m">#FFFFFF</text><rect x="334" y="226" width="24" height="24" rx="6" fill="#141218" stroke="#555555" stroke-width="1"/><text x="366" y="243" font-size="13" fill="#ccc8cf" class="m">#141218</text><text x="44" y="281" font-size="14" font-weight="600" fill="#f1f1f1" class="m">onBackground</text><rect x="214" y="264" width="24" height="24" rx="6" fill="#000000" stroke="#555555" stroke-width="1"/><text x="246" y="281" font-size="13" fill="#ccc8cf" class="m">#000000</text><rect x="334" y="264" width="24" height="24" rx="6" fill="#E6E0E9" stroke="#555555" stroke-width="1"/><text x="366" y="281" font-size="13" fill="#ccc8cf" class="m">#E6E0E9</text><text x="44" y="319" font-size="14" font-weight="600" fill="#f1f1f1" class="m">sheet</text><rect x="214" y="302" width="24" height="24" rx="6" fill="#FAFAFA" stroke="#555555" stroke-width="1"/><text x="246" y="319" font-size="13" fill="#ccc8cf" class="m">#FAFAFA</text><rect x="334" y="302" width="24" height="24" rx="6" fill="#1D1B20" stroke="#555555" stroke-width="1"/><text x="366" y="319" font-size="13" fill="#ccc8cf" class="m">#1D1B20</text><text x="44" y="357" font-size="14" font-weight="600" fill="#f1f1f1" class="m">neutral</text><rect x="214" y="340" width="24" height="24" rx="6" fill="#8A8598" stroke="#555555" stroke-width="1"/><text x="246" y="357" font-size="13" fill="#ccc8cf" class="m">#8A8598</text><rect x="334" y="340" width="24" height="24" rx="6" fill="#938F99" stroke="#555555" stroke-width="1"/><text x="366" y="357" font-size="13" fill="#ccc8cf" class="m">#938F99</text><text x="44" y="395" font-size="14" font-weight="600" fill="#f1f1f1" class="m">icon</text><rect x="214" y="378" width="24" height="24" rx="6" fill="#444444" stroke="#555555" stroke-width="1"/><text x="246" y="395" font-size="13" fill="#ccc8cf" class="m">#444444</text><rect x="334" y="378" width="24" height="24" rx="6" fill="#CAC4D0" stroke="#555555" stroke-width="1"/><text x="366" y="395" font-size="13" fill="#ccc8cf" class="m">#CAC4D0</text><text x="628" y="52" font-size="13" font-weight="700" fill="#a4a1a6">Component property, by default</text><rect x="628" y="71" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="91" font-size="14" font-weight="700" fill="#f1f1f1">Button</text><text x="738" y="91" font-size="14" fill="#ccc8cf">Background</text><path d="M628,86 L472,86" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="109" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="129" font-size="14" font-weight="700" fill="#f1f1f1">Button</text><text x="738" y="129" font-size="14" fill="#ccc8cf">Text Color</text><path d="M628,124 L472,124" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="223" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="243" font-size="14" font-weight="700" fill="#f1f1f1">CardView</text><text x="738" y="243" font-size="14" fill="#ccc8cf">Background</text><path d="M628,238 L472,238" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="261" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="281" font-size="14" font-weight="700" fill="#f1f1f1">TextView</text><text x="738" y="281" font-size="14" fill="#ccc8cf">Text Color</text><path d="M628,276 L472,276" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="299" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="319" font-size="14" font-weight="700" fill="#f1f1f1">Screen</text><text x="738" y="319" font-size="14" fill="#ccc8cf">Background</text><path d="M628,314 L472,314" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="337" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="357" font-size="14" font-weight="700" fill="#f1f1f1">Input</text><text x="738" y="357" font-size="14" fill="#ccc8cf">Hint Color</text><path d="M628,352 L472,352" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="628" y="375" width="308" height="30" rx="8" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="642" y="395" font-size="14" font-weight="700" fill="#f1f1f1">Icon</text><text x="738" y="395" font-size="14" fill="#ccc8cf">Color</text><path d="M628,390 L472,390" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><text x="550" y="52" font-size="13" fill="#a4a1a6" text-anchor="middle">points at</text><text x="480" y="456" font-size="13.5" fill="#a4a1a6" text-anchor="middle">Every collection has the same nine roles. Only the colours differ.</text></svg>
