<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc"><title id="title">How an HttpRequest call runs</title><desc id="desc">Your blocks set the HttpRequest's URL, Method and Body (for POST, PUT or PATCH, a dictionary turned into text with to json text), then call HttpRequest1.Make Request, which takes no arguments. HttpRequest1 sends the request. If the server answers, with any status code including 404 and 500, the event Got Response fires with responseCode, response and tag: when responseCode is 200 to 299, put response through parse json and use the data; for any other code, show a message. If no answer comes back, because there is no network or the address is wrong, Error Occurred fires with error and tag: show a message and offer Retry.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="560" fill="#ffffff"/><path d="M190,62 L190,544" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/><path d="M570,62 L570,544" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/><path d="M846,62 L846,544" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/><rect x="94" y="18" width="192" height="44" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="190" y="45.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Your blocks</text><rect x="474" y="18" width="192" height="44" rx="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="570" y="45.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle" class="m">HttpRequest1</text><rect x="766" y="18" width="160" height="44" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="846" y="45.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">The server</text><path d="M46,82 H52 l5,5 h12 l5,-5 H334 Q340,82 340,88 V110 Q340,116 334,116 H74 l-5,5 h-12 l-5,-5 H46 Q40,116 40,110 V88 Q40,82 46,82 Z" fill="#483faa"/><text x="54" y="104" font-size="14" font-weight="600" fill="#ffffff">set URL, Method and Body</text><path d="M46,130 H52 l5,5 h12 l5,-5 H334 Q340,130 340,136 V158 Q340,164 334,164 H74 l-5,5 h-12 l-5,-5 H46 Q40,164 40,158 V136 Q40,130 46,130 Z" fill="#6e66cc"/><text x="54" y="152" font-size="14" font-weight="600" fill="#ffffff">call HttpRequest1.Make Request</text><path d="M340,147 L570,147" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="403.6" y="124" width="102.8" height="20" rx="4" fill="#ffffff"/><text x="455" y="139" font-size="13" font-weight="600" fill="#2f2f2f" text-anchor="middle">no arguments</text><path d="M570,182 L846,182" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="660.3" y="159" width="95.4" height="20" rx="4" fill="#ffffff"/><text x="708" y="174" font-size="13" font-weight="600" fill="#2f2f2f" text-anchor="middle">the request</text><rect x="24" y="206" width="912" height="200" rx="12" fill="none" stroke="#6e66cc" stroke-width="1.5"/><rect x="24" y="194" width="334" height="24" rx="12" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="191" y="210.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">The server answers, with any status code</text><path d="M846,240 L570,240" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="627" y="217" width="162" height="20" rx="4" fill="#ffffff"/><text x="708" y="232" font-size="13" font-weight="600" fill="#2f2f2f" text-anchor="middle">status code and body</text><path d="M570,276 L346,276" fill="none" stroke="#483faa" stroke-width="1.5" marker-end="url(#m-accent)"/><rect x="406.6" y="253" width="102.8" height="20" rx="4" fill="#ffffff"/><text x="458" y="268" font-size="13" font-weight="600" fill="#483faa" text-anchor="middle">Got Response</text><rect x="40" y="232" width="306" height="66" rx="8" fill="#322c7d"/><text x="54" y="256" font-size="14" font-weight="600" fill="#ffffff">when HttpRequest1.Got Response</text><text x="54" y="282" font-size="13" fill="#e1deff">responseCode · response · tag</text><rect x="40" y="316" width="150" height="74" rx="10" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="115" y="337.54" font-size="14" font-weight="600" fill="#016630" text-anchor="middle">200–299</text><text x="115" y="360.18" font-size="13" fill="#2f2f2f" text-anchor="middle">parse json, then</text><text x="115" y="378.18" font-size="13" fill="#2f2f2f" text-anchor="middle">use the data</text><rect x="198" y="316" width="148" height="74" rx="10" fill="#fef7e6" stroke="#f0b100" stroke-width="1.5"/><text x="272" y="337.54" font-size="14" font-weight="600" fill="#894b00" text-anchor="middle">Any other code</text><text x="272" y="360.18" font-size="13" fill="#2f2f2f" text-anchor="middle">404s too: show</text><text x="272" y="378.18" font-size="13" fill="#2f2f2f" text-anchor="middle">a message</text><text x="618" y="316" font-size="13" fill="#5f5e62">Got Response fires for every answer,</text><text x="618" y="335" font-size="13" fill="#5f5e62">errors included. Check responseCode</text><text x="618" y="354" font-size="13" fill="#5f5e62">before you use the body.</text><rect x="24" y="434" width="912" height="110" rx="12" fill="none" stroke="#fb2c36" stroke-width="1.5"/><rect x="24" y="422" width="318" height="24" rx="12" fill="#ffeaeb" stroke="#fb2c36" stroke-width="1.5"/><text x="183" y="438.68" font-size="13" font-weight="600" fill="#9f0712" text-anchor="middle">No answer: no network or a bad address</text><path d="M570,462 L806,462" fill="none" stroke="#a4a1a6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="812" y="467" font-size="18" font-weight="700" fill="#9f0712">×</text><path d="M570,492 L346,492" fill="none" stroke="#fb2c36" stroke-width="1.5" marker-end="url(#m-err)"/><rect x="399.2" y="469" width="117.6" height="20" rx="4" fill="#ffffff"/><text x="458" y="484" font-size="13" font-weight="600" fill="#9f0712" text-anchor="middle">Error Occurred</text><rect x="40" y="458" width="306" height="66" rx="8" fill="#322c7d"/><text x="54" y="482" font-size="14" font-weight="600" fill="#ffffff">when HttpRequest1.Error Occurred</text><text x="54" y="508" font-size="13" fill="#e1deff">error · tag  →  show a message, Retry</text></svg>
