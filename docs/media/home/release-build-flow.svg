<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="title desc"><title id="title">How a release build runs</title><desc id="desc">Start a build from the Build menu (Cmd+B or Ctrl+B) and pick Android App (.apk) or iOS App (.ipa). Before it starts, Duddy checks that your plan includes iOS and that the Apple preflight passes (iOS only), that a build worker is online, and that you are within your hourly build limit; past it you confirm This build costs credits. If a check fails the build is not started and a message says why. The console then shows Building while Duddy writes the app source and Gradle or Xcode compiles it. It ends Ready, with a QR code, Download app and Copy link, where the file and link last one hour; or Failed, with what went wrong and what to do, and logs kept for 24 hours.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="370" fill="#ffffff"/><rect x="24" y="92" width="172" height="116" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="110" y="126.26" font-size="16" font-weight="600" fill="#111014" text-anchor="middle">Build</text><text x="110" y="149.68" font-size="13" fill="#5f5e62" text-anchor="middle">⌘B or Ctrl+B</text><text x="110" y="167.68" font-size="13" fill="#5f5e62" text-anchor="middle">Android App (.apk)</text><text x="110" y="185.68" font-size="13" fill="#5f5e62" text-anchor="middle">iOS App (.ipa)</text><path d="M196,150 L222,150" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="222" y="32" width="278" height="236" rx="12" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="242" y="60" font-size="15" font-weight="700" fill="#111014">Checks before it starts</text><circle cx="252" cy="87" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M247.8,87.2 L251,90.4 L256.5,84" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="272" y="92" font-size="14" font-weight="600" fill="#111014">Your plan includes iOS</text><rect x="439" y="75" width="45" height="22" rx="11" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="461.5" y="90.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">iOS</text><circle cx="252" cy="131" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M247.8,131.2 L251,134.4 L256.5,128" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="272" y="136" font-size="14" font-weight="600" fill="#111014">Apple preflight passes</text><rect x="439" y="119" width="45" height="22" rx="11" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="461.5" y="134.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">iOS</text><circle cx="252" cy="175" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M247.8,175.2 L251,178.4 L256.5,172" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="272" y="180" font-size="14" font-weight="600" fill="#111014">A build worker is online</text><circle cx="252" cy="219" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M247.8,219.2 L251,222.4 L256.5,216" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="272" y="224" font-size="14" font-weight="600" fill="#111014">Within your hourly limit</text><text x="272" y="244" font-size="13" fill="#5f5e62">Past it: This build costs credits</text><path d="M361,268 L361,300" fill="none" stroke="#a4a1a6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-dim)"/><rect x="250" y="300" width="222" height="56" rx="10" fill="#ffffff" stroke="#a4a1a6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="361" y="321.54" font-size="14" font-weight="600" fill="#5f5e62" text-anchor="middle">Not started</text><text x="361" y="344.18" font-size="13" fill="#5f5e62" text-anchor="middle">A message says why</text><path d="M500,150 L526,150" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="526" y="76" width="168" height="148" rx="12" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="568" y="90" width="84" height="26" rx="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="610" y="107.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Building</text><text x="610" y="142" font-size="13" fill="#2f2f2f" text-anchor="middle">Duddy writes the</text><text x="610" y="161" font-size="13" fill="#2f2f2f" text-anchor="middle">app's source, then</text><text x="610" y="180" font-size="13" fill="#2f2f2f" text-anchor="middle">Gradle or Xcode</text><text x="610" y="199" font-size="13" fill="#2f2f2f" text-anchor="middle">compiles it</text><path d="M694,150 L712,150" fill="none" stroke="#5e5b79" stroke-width="1.5"/><path d="M712,92 L712,212" fill="none" stroke="#5e5b79" stroke-width="1.5"/><path d="M712,92 L732,92" fill="none" stroke="#00c951" stroke-width="1.5" marker-end="url(#m-ok)"/><path d="M712,212 L732,212" fill="none" stroke="#fb2c36" stroke-width="1.5" marker-end="url(#m-err)"/><rect x="732" y="32" width="204" height="120" rx="12" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><rect x="750" y="44" width="61" height="26" rx="13" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="780.5" y="61.68" font-size="13" font-weight="600" fill="#016630" text-anchor="middle">Ready</text><text x="750" y="94" font-size="13" fill="#2f2f2f">QR code, Download app</text><text x="750" y="113" font-size="13" fill="#2f2f2f">and Copy link</text><text x="750" y="136" font-size="13" font-weight="600" fill="#016630">File and link last 1 hour</text><rect x="732" y="164" width="204" height="120" rx="12" fill="#ffeaeb" stroke="#fb2c36" stroke-width="1.5"/><rect x="750" y="176" width="69" height="26" rx="13" fill="#ffeaeb" stroke="#fb2c36" stroke-width="1.5"/><text x="784.5" y="193.68" font-size="13" font-weight="600" fill="#9f0712" text-anchor="middle">Failed</text><text x="750" y="226" font-size="13" fill="#2f2f2f">What went wrong</text><text x="750" y="245" font-size="13" fill="#2f2f2f">and what to do</text><text x="750" y="268" font-size="13" font-weight="600" fill="#9f0712">Logs kept for 24 hours</text></svg>
