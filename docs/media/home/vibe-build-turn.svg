<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" width="960" height="586" role="img" aria-labelledby="title desc"><title id="title">What happens in a Vibe mode build turn</title><desc id="desc">A Vibe mode build turn, in order: your message; Reading your picture, only if your models cannot see images; Understanding your request, which may instead answer a question or ask you one question first; Designing the look (or Keeping the look) with the design model; Planning screens with the build model; Adding components if the plan needs one; Finding photos the plan asks for, and Making images when AI images is on; then every screen at the same time goes through Drawing, Wiring, Reviewing (Best quality with the designer open) and Ready; then Testing the app; then Done, with a summary and Undo.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="586" fill="#ffffff"/><rect x="24" y="104" width="140" height="78" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="94" y="148.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Your message</text><path d="M164,143 L188,143" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="188" y="104" width="188" height="78" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="282" y="127.54" font-size="14" font-weight="600" fill="#111014" text-anchor="middle">Reading your picture</text><text x="282" y="150.18" font-size="13" fill="#5f5e62" text-anchor="middle">Only if your models</text><text x="282" y="168.18" font-size="13" fill="#5f5e62" text-anchor="middle">can't see images</text><path d="M376,143 L400,143" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="400" y="104" width="182" height="78" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="491" y="138.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Understanding</text><text x="491" y="158.4" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">your request</text><path d="M582,143 L612,143" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="612" y="104" width="324" height="78" rx="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="774" y="136.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Designing the look</text><text x="774" y="160.18" font-size="13" fill="#5f5e62" text-anchor="middle">Or Keeping the look when the app has one</text><rect x="716" y="170" width="116" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="774" y="186.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Design model</text><rect x="290" y="14" width="214" height="54" rx="10" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="397" y="34.54" font-size="14" font-weight="600" fill="#111014" text-anchor="middle">Replying</text><text x="397" y="57.18" font-size="13" fill="#5f5e62" text-anchor="middle">when you asked a question</text><rect x="520" y="14" width="226" height="54" rx="10" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="633" y="34.54" font-size="14" font-weight="600" fill="#111014" text-anchor="middle">One question for you</text><text x="633" y="57.18" font-size="13" fill="#5f5e62" text-anchor="middle">when it needs a detail first</text><path d="M440,104 L440,68" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><path d="M548,104 L548,68" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><path d="M774,194 L774,206 Q774,214 766,214 L137,214 Q129,214 129,222 L129,250" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="24" y="250" width="210" height="78" rx="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="129" y="282.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Planning screens</text><text x="129" y="306.18" font-size="13" fill="#5f5e62" text-anchor="middle">What each screen holds</text><rect x="75" y="316" width="108" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="129" y="332.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Build model</text><path d="M234,289 L264,289" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="264" y="250" width="210" height="78" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="369" y="282.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Adding components</text><text x="369" y="306.18" font-size="13" fill="#5f5e62" text-anchor="middle">Only if the plan needs one</text><path d="M474,289 L504,289" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="504" y="250" width="222" height="78" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="615" y="273.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Finding photos</text><text x="615" y="297.18" font-size="13" fill="#5f5e62" text-anchor="middle">and Making images, when</text><text x="615" y="315.18" font-size="13" fill="#5f5e62" text-anchor="middle">AI images is on</text><rect x="748" y="268" width="188" height="42" rx="10" fill="#ffffff" stroke="#e5e1ec" stroke-width="1.5"/><rect x="762" y="281" width="30" height="16" rx="4" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="802" y="294" font-size="13" fill="#5f5e62">Only when needed</text><path d="M615,328 L615,344 Q615,352 607,352 L312,352 Q304,352 304,360 L304,384" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="24" y="384" width="560" height="158" rx="14" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="44" y="412" font-size="15" font-weight="700" fill="#111014">Every screen, at the same time</text><rect x="456" y="396" width="108" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="510" y="412.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Build model</text><text x="44" y="450" font-size="13" fill="#5f5e62">Screen 1</text><rect x="126" y="432" width="86" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="169" y="449.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Drawing</text><path d="M212,445 L236,445" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="236" y="432" width="76" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="274" y="449.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Wiring</text><path d="M312,445 L336,445" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="336" y="432" width="100" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="386" y="449.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Reviewing</text><path d="M436,445 L460,445" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="460" y="432" width="70" height="26" rx="13" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="495" y="449.68" font-size="13" font-weight="600" fill="#016630" text-anchor="middle">Ready</text><text x="44" y="484" font-size="13" fill="#5f5e62">Screen 2</text><rect x="126" y="466" width="86" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="169" y="483.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Drawing</text><path d="M212,479 L236,479" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="236" y="466" width="76" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="274" y="483.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Wiring</text><path d="M312,479 L336,479" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="336" y="466" width="100" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="386" y="483.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Reviewing</text><path d="M436,479 L460,479" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="460" y="466" width="70" height="26" rx="13" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="495" y="483.68" font-size="13" font-weight="600" fill="#016630" text-anchor="middle">Ready</text><text x="44" y="518" font-size="13" fill="#5f5e62">Screen 3</text><rect x="126" y="500" width="86" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="169" y="517.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Drawing</text><path d="M212,513 L236,513" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="236" y="500" width="76" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="274" y="517.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Wiring</text><path d="M312,513 L336,513" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="336" y="500" width="100" height="26" rx="13" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="386" y="517.68" font-size="13" font-weight="600" fill="#111014" text-anchor="middle">Reviewing</text><path d="M436,513 L460,513" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="460" y="500" width="70" height="26" rx="13" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="495" y="517.68" font-size="13" font-weight="600" fill="#016630" text-anchor="middle">Ready</text><text x="44" y="566" font-size="13" fill="#5f5e62">Reviewing runs on Best quality, with the designer open.</text><path d="M584,463 L614,463" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="614" y="414" width="168" height="98" rx="10" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="698" y="447.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle">Testing the app</text><text x="698" y="471.18" font-size="13" fill="#5f5e62" text-anchor="middle">Opens screens, fills</text><text x="698" y="489.18" font-size="13" fill="#5f5e62" text-anchor="middle">forms, fixes faults</text><path d="M782,463 L812,463" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="812" y="414" width="124" height="98" rx="10" fill="#e6faee" stroke="#00c951" stroke-width="1.5"/><text x="874" y="447.9" font-size="15" font-weight="600" fill="#016630" text-anchor="middle">Done</text><text x="874" y="471.18" font-size="13" fill="#2f2f2f" text-anchor="middle">Summary,</text><text x="874" y="489.18" font-size="13" fill="#2f2f2f" text-anchor="middle">changes, Undo</text></svg>
