<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" role="img" aria-labelledby="title desc"><title id="title">How a Vibe turn holds and settles credits</title><desc id="desc">Before a turn starts, it needs at least 10 credits on a paid plan or 1 on the free trial, today's allowance must cover it too if your plan has one, and credits already held do not count; if not, it does not start. While it runs, a hold is set aside and grows step by step. When it ends, you are charged for what the turn used and the rest of the hold returns to your balance. A turn that has started always finishes. Holds stop two turns running at once from spending the same credit.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="346" fill="#ffffff"/><circle cx="37" cy="32" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="37" y="36.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="58" y="37" font-size="15" font-weight="700" fill="#111014">Before it starts</text><circle cx="385" cy="32" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="385" y="36.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="406" y="37" font-size="15" font-weight="700" fill="#111014">While it runs</text><circle cx="677" cy="32" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="677" y="36.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="698" y="37" font-size="15" font-weight="700" fill="#111014">When it ends</text><rect x="24" y="60" width="316" height="186" rx="12" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="44" y="90" font-size="15" font-weight="700" fill="#111014">Can it start?</text><circle cx="54" cy="115" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M49.8,115.2 L53,118.4 L58.5,112" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="74" y="120" font-size="13.5" fill="#2f2f2f">At least 10 credits (1 on the trial)</text><circle cx="54" cy="147" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M49.8,147.2 L53,150.4 L58.5,144" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="74" y="152" font-size="13.5" fill="#2f2f2f">Within today's allowance, if any</text><circle cx="54" cy="179" r="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M49.8,179.2 L53,182.4 L58.5,176" fill="none" stroke="#483faa" stroke-width="1.8" stroke-linejoin="true" stroke-linecap="round"/><text x="74" y="184" font-size="13.5" fill="#2f2f2f">Credits already held don't count</text><text x="44" y="226" font-size="13" fill="#5f5e62">If not, it doesn't start.</text><text x="372" y="84" font-size="13.5" fill="#2f2f2f">A hold is set aside and</text><text x="372" y="104" font-size="13.5" fill="#2f2f2f">grows step by step</text><rect x="380" y="210" width="32" height="26" rx="4" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="430" y="186" width="32" height="50" rx="4" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="480" y="162" width="32" height="74" rx="4" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="530" y="138" width="32" height="98" rx="4" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="580" y="114" width="32" height="122" rx="4" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><path d="M370,236 L632,236" stroke="#c8c5d0" stroke-width="1.5" fill="none"/><text x="372" y="258" font-size="13" fill="#5f5e62">Each step of the turn adds to it</text><rect x="676" y="114" width="40" height="40" rx="4" fill="#ffffff" stroke="#6e66cc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="676" y="154" width="40" height="82" rx="4" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><path d="M664,236 L936,236" stroke="#c8c5d0" stroke-width="1.5" fill="none"/><path d="M724,134 L740,134" stroke="#5e5b79" stroke-width="1.5" fill="none"/><path d="M724,195 L740,195" stroke="#5e5b79" stroke-width="1.5" fill="none"/><text x="748" y="130" font-size="13.5" font-weight="600" fill="#111014">Returned to</text><text x="748" y="148" font-size="13.5" font-weight="600" fill="#111014">your balance</text><text x="748" y="191" font-size="13.5" font-weight="600" fill="#483faa">Charged: what</text><text x="748" y="209" font-size="13.5" font-weight="600" fill="#483faa">the turn used</text><text x="664" y="258" font-size="13" fill="#5f5e62">A started turn always finishes.</text><rect x="24" y="284" width="912" height="44" rx="10" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="480" y="311.04" font-size="14" font-weight="500" fill="#111014" text-anchor="middle">Holds stop two turns running at once from spending the same credit.</text></svg>
