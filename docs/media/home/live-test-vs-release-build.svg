<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc"><title id="title">Live test compared with a release build</title><desc id="desc">Live test: build your test app once (free, up to six rebuilds an hour per project), install it and pair it by scanning the QR code or typing the code, then design as usual while screens and logic update on the phone. Rebuild it after changing the app name, package id, icon, splash screen, version, permissions or integration keys, or after adding, removing or updating components. Release build: choose Android App (.apk) or iOS App (.ipa) from Build, Duddy compiles a standalone app with Gradle or with Xcode on a Mac, then you install or share the file; the download and link last one hour. Builds are free within your plan's hourly limit and cost a few credits past it.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><rect x="24" y="24" width="444" height="432" rx="14" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="48" y="62" font-size="19" font-weight="700" fill="#111014">Live test</text><text x="444" y="61" font-size="13" fill="#5f5e62" text-anchor="end">While you design</text><path d="M48,82 L444,82" stroke="#6e66cc" stroke-width="1" fill="none"/><circle cx="62" cy="120" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="62" y="124.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="88" y="117" font-size="15" font-weight="600" fill="#111014">Build your test app once</text><text x="88" y="139" font-size="13" fill="#5f5e62">Free · up to 6 rebuilds an hour per project</text><path d="M62,136 L62,174" stroke="#6e66cc" stroke-width="1.5" fill="none"/><circle cx="62" cy="190" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="62" y="194.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="88" y="187" font-size="15" font-weight="600" fill="#111014">Install it and pair it</text><text x="88" y="209" font-size="13" fill="#5f5e62">Scan the QR code or type the pairing code</text><path d="M62,206 L62,244" stroke="#6e66cc" stroke-width="1.5" fill="none"/><circle cx="62" cy="260" r="13" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="62" y="264.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="88" y="257" font-size="15" font-weight="600" fill="#111014">Design as usual</text><text x="88" y="279" font-size="13" fill="#5f5e62">Screens and logic update on the phone</text><rect x="44" y="324" width="404" height="112" rx="10" fill="#ffffff" stroke="#6e66cc" stroke-width="1.5"/><text x="62" y="351" font-size="14" font-weight="700" fill="#111014">Rebuild the test app after changing</text><text x="62" y="376" font-size="13" fill="#2f2f2f">App name, package id, icon, splash screen,</text><text x="62" y="396" font-size="13" fill="#2f2f2f">version, permissions or integration keys, or</text><text x="62" y="416" font-size="13" fill="#2f2f2f">adding, removing or updating components</text><rect x="492" y="24" width="444" height="432" rx="14" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="516" y="62" font-size="19" font-weight="700" fill="#111014">Release build</text><text x="912" y="61" font-size="13" fill="#5f5e62" text-anchor="end">When you want to share it</text><path d="M516,82 L912,82" stroke="#e5e1ec" stroke-width="1" fill="none"/><circle cx="530" cy="120" r="13" fill="#322c7d" stroke="#322c7d" stroke-width="1.5"/><text x="530" y="124.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="556" y="117" font-size="15" font-weight="600" fill="#111014">Choose a target from Build</text><text x="556" y="139" font-size="13" fill="#5f5e62">Android App (.apk) or iOS App (.ipa)</text><path d="M530,136 L530,174" stroke="#c8c5d0" stroke-width="1.5" fill="none"/><circle cx="530" cy="190" r="13" fill="#322c7d" stroke="#322c7d" stroke-width="1.5"/><text x="530" y="194.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="556" y="187" font-size="15" font-weight="600" fill="#111014">Duddy compiles a standalone app</text><text x="556" y="209" font-size="13" fill="#5f5e62">Gradle for Android, Xcode on a Mac for iOS</text><path d="M530,206 L530,244" stroke="#c8c5d0" stroke-width="1.5" fill="none"/><circle cx="530" cy="260" r="13" fill="#322c7d" stroke="#322c7d" stroke-width="1.5"/><text x="530" y="264.68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="556" y="257" font-size="15" font-weight="600" fill="#111014">Install or share the file</text><text x="556" y="279" font-size="13" fill="#5f5e62">The download and its link last one hour</text><rect x="512" y="324" width="404" height="112" rx="10" fill="#ffffff" stroke="#e5e1ec" stroke-width="1.5"/><text x="530" y="351" font-size="14" font-weight="700" fill="#111014">What it costs</text><text x="530" y="376" font-size="13" fill="#2f2f2f">Free within your plan's hourly build limit.</text><text x="530" y="396" font-size="13" fill="#2f2f2f">Past the limit, each build costs a few</text><text x="530" y="416" font-size="13" fill="#2f2f2f">credits, and you are asked first.</text></svg>
