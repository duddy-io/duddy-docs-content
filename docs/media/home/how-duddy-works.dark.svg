<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="title desc"><title id="title">How a Duddy project becomes an app</title><desc id="desc">Canvas, Blocks and Vibe (AI) all edit one Duddy project: its component tree, logic blocks, theme and assets. A build compiles the project to an Android APK with Gradle or an ad hoc iOS app with Xcode on a Mac; web builds are coming soon. Live test runs the same project in a test app on your phone and follows every edit.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#adaaaf"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#adaaaf"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b4abe4"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#b4abe4"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#78767a"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#78767a"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="404" fill="#1d1c20"/><rect x="24" y="74" width="200" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="124" y="105.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Canvas</text><text x="124" y="129.18" font-size="13" fill="#a4a1a6" text-anchor="middle">Drag, drop and style</text><path d="M224,112 L286,112" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="24" y="174" width="200" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="124" y="205.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Blocks</text><text x="124" y="229.18" font-size="13" fill="#a4a1a6" text-anchor="middle">Logic that snaps together</text><path d="M224,212 L286,212" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="24" y="274" width="200" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="124" y="305.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Vibe (AI)</text><text x="124" y="329.18" font-size="13" fill="#a4a1a6" text-anchor="middle">Describe it in a sentence</text><path d="M224,312 L286,312" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><text x="124" y="52" font-size="13" font-weight="600" fill="#a4a1a6" text-anchor="middle">Three ways to edit</text><rect x="288" y="40" width="236" height="340" rx="14" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="406" y="72" font-size="17" font-weight="700" fill="#f1f1f1" text-anchor="middle">Your project</text><text x="406" y="94" font-size="13" fill="#a4a1a6" text-anchor="middle">One set of screens</text><rect x="304" y="114" width="204" height="70" rx="10" fill="#1d1c20" stroke="#555555" stroke-width="1.5"/><text x="406" y="142.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Component tree</text><text x="406" y="166.18" font-size="13" fill="#a4a1a6" text-anchor="middle">What each screen shows</text><rect x="304" y="200" width="204" height="70" rx="10" fill="#1d1c20" stroke="#555555" stroke-width="1.5"/><text x="406" y="228.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Logic blocks</text><text x="406" y="252.18" font-size="13" fill="#a4a1a6" text-anchor="middle">What happens when used</text><rect x="304" y="286" width="204" height="70" rx="10" fill="#1d1c20" stroke="#555555" stroke-width="1.5"/><text x="406" y="314.9" font-size="15" font-weight="600" fill="#f1f1f1" text-anchor="middle">Theme and assets</text><text x="406" y="338.18" font-size="13" fill="#a4a1a6" text-anchor="middle">Colours, fonts and images</text><path d="M524,166 L566,166" fill="none" stroke="#adaaaf" stroke-width="1.5"/><path d="M566,78 L566,254" fill="none" stroke="#adaaaf" stroke-width="1.5"/><text x="545" y="156" font-size="13" font-weight="700" fill="#b4abe4" text-anchor="middle">Build</text><path d="M566,78 L612,78" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="612" y="40" width="324" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="632" y="71" font-size="16" font-weight="700" fill="#f1f1f1">Android</text><text x="632" y="96" font-size="13" fill="#a4a1a6">Java, compiled with Gradle</text><rect x="867" y="54" width="53" height="24" rx="12" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="893.5" y="70.68" font-size="13" font-weight="600" fill="#f1f1f1" text-anchor="middle">.apk</text><path d="M566,166 L612,166" fill="none" stroke="#adaaaf" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="612" y="128" width="324" height="76" rx="10" fill="#28272b" stroke="#555555" stroke-width="1.5"/><text x="632" y="159" font-size="16" font-weight="700" fill="#f1f1f1">iOS</text><rect x="670" y="142" width="53" height="22" rx="11" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="696.5" y="157.68" font-size="13" font-weight="600" fill="#f1f1f1" text-anchor="middle">Beta</text><text x="632" y="184" font-size="13" fill="#a4a1a6">Swift, compiled with Xcode on a Mac</text><rect x="797" y="142" width="123" height="24" rx="12" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="858.5" y="158.68" font-size="13" font-weight="600" fill="#f1f1f1" text-anchor="middle">.ipa (ad hoc)</text><path d="M566,254 L612,254" fill="none" stroke="#78767a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-dim)"/><rect x="612" y="216" width="324" height="76" rx="10" fill="#1d1c20" stroke="#78767a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="632" y="247" font-size="16" font-weight="700" fill="#a4a1a6">Web</text><text x="632" y="272" font-size="13" fill="#a4a1a6">A web app you can host</text><rect x="812" y="230" width="108" height="24" rx="12" fill="#1d1c20" stroke="#78767a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="866" y="246.68" font-size="13" font-weight="600" fill="#a4a1a6" text-anchor="middle">Coming soon</text><path d="M524,342 L612,342" fill="none" stroke="#b4abe4" stroke-width="1.5" marker-end="url(#m-accent)"/><text x="568" y="332" font-size="13" font-weight="700" fill="#b4abe4" text-anchor="middle">Live test</text><rect x="612" y="304" width="324" height="76" rx="10" fill="#2a2645" stroke="#6e66cc" stroke-width="1.5"/><text x="632" y="335" font-size="16" font-weight="700" fill="#f1f1f1">Test app on your phone</text><text x="632" y="360" font-size="13" fill="#a4a1a6">Runs the project and follows every edit</text><rect x="867" y="318" width="53" height="24" rx="12" fill="#483faa" stroke="#483faa" stroke-width="1.5"/><text x="893.5" y="334.68" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Free</text></svg>
