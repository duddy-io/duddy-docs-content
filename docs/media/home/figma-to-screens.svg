<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc"><title id="title">From Figma frames to Duddy screens</title><desc id="desc">Your Figma file, with frames such as Log in, Home and Profile, is read through your Figma connection, read-only and from Duddy's server. In the Vibe chat, /figma lets you pick one frame or the whole file. Duddy reads each frame as a picture together with its layer details, and builds screens of ordinary components you can edit, a theme from the file's colours and type, and project assets from its image fills. Typically, auto layout becomes a Column or Row, a text layer a TextView, and an image fill an Image with a project asset. Each turn builds up to 8 screens and stores up to 16 images; landscape frames are skipped when the file has portrait ones; the look comes from the file, not from your prompt.</desc><style>text{font-family:DM Sans, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, JetBrains Mono, monospace}</style><defs><marker id="m-line" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5e5b79"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#5e5b79"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#483faa"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#483faa"/></marker><marker id="m-dim" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a4a1a6"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#a4a1a6"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00c951"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#00c951"/></marker><marker id="m-err" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fb2c36"/></marker><marker id="s-err" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#fb2c36"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="24" y="24" width="262" height="236" rx="14" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="44" y="54" font-size="15" font-weight="700" fill="#111014">Your Figma file</text><text x="44" y="82" font-size="13" fill="#5f5e62">Log in</text><rect x="44" y="90" width="66" height="140" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><rect x="52" y="102" width="50" height="8" rx="4" fill="#6e66cc"/><rect x="52" y="118" width="36" height="6" rx="3" fill="#c8c5d0"/><rect x="52" y="134" width="50" height="38" rx="5" fill="#f4f0ff"/><rect x="52" y="206" width="50" height="14" rx="7" fill="#483faa"/><text x="122" y="82" font-size="13" fill="#5f5e62">Home</text><rect x="122" y="90" width="66" height="140" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><rect x="130" y="102" width="50" height="8" rx="4" fill="#6e66cc"/><rect x="130" y="118" width="36" height="6" rx="3" fill="#c8c5d0"/><rect x="130" y="134" width="50" height="38" rx="5" fill="#f4f0ff"/><rect x="130" y="206" width="50" height="14" rx="7" fill="#483faa"/><text x="200" y="82" font-size="13" fill="#5f5e62">Profile</text><rect x="200" y="90" width="66" height="140" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><rect x="208" y="102" width="50" height="8" rx="4" fill="#6e66cc"/><rect x="208" y="118" width="36" height="6" rx="3" fill="#c8c5d0"/><rect x="208" y="134" width="50" height="38" rx="5" fill="#f4f0ff"/><rect x="208" y="206" width="50" height="14" rx="7" fill="#483faa"/><path d="M286,142 L320,142" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="320" y="24" width="270" height="236" rx="14" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><rect x="340" y="44" width="230" height="70" rx="10" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="455" y="72.9" font-size="15" font-weight="600" fill="#111014" text-anchor="middle" class="m">/figma</text><text x="455" y="96.18" font-size="13" fill="#5f5e62" text-anchor="middle">Pick a frame or the whole file</text><path d="M455,114 L455,140" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="340" y="140" width="230" height="100" rx="10" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="455" y="165.54" font-size="14" font-weight="600" fill="#111014" text-anchor="middle">Duddy reads each frame</text><text x="455" y="188.18" font-size="13" fill="#5f5e62" text-anchor="middle">A picture of it, plus its</text><text x="455" y="206.18" font-size="13" fill="#5f5e62" text-anchor="middle">layer details. Read-only,</text><text x="455" y="224.18" font-size="13" fill="#5f5e62" text-anchor="middle">from Duddy's server</text><path d="M590,142 L624,142" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="624" y="24" width="312" height="236" rx="14" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="644" y="54" font-size="15" font-weight="700" fill="#111014">Your project</text><rect x="644" y="70" width="272" height="52" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="658" y="92" font-size="14" font-weight="700" fill="#111014">Screens</text><text x="658" y="111" font-size="13" fill="#5f5e62">Ordinary components you can edit</text><rect x="644" y="132" width="272" height="52" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="658" y="154" font-size="14" font-weight="700" fill="#111014">Theme</text><text x="658" y="173" font-size="13" fill="#5f5e62">Colours and type from the file's styles</text><rect x="644" y="194" width="272" height="52" rx="8" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="658" y="216" font-size="14" font-weight="700" fill="#111014">Assets</text><text x="658" y="235" font-size="13" fill="#5f5e62">Image fills, stored in the project</text><rect x="828" y="140" width="16" height="16" rx="4" fill="#4B1FA8" stroke="#c8c5d0" stroke-width="1"/><rect x="848" y="140" width="16" height="16" rx="4" fill="#ECDFFF" stroke="#c8c5d0" stroke-width="1"/><rect x="868" y="140" width="16" height="16" rx="4" fill="#21005D" stroke="#c8c5d0" stroke-width="1"/><rect x="888" y="140" width="16" height="16" rx="4" fill="#FAFAFA" stroke="#c8c5d0" stroke-width="1"/><text x="24" y="302" font-size="15" font-weight="700" fill="#111014">Typically</text><rect x="24" y="318" width="190" height="32" rx="8" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="40" y="339" font-size="14" font-weight="600" fill="#111014">Auto layout</text><path d="M214,334 L258,334" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="258" y="318" width="290" height="32" rx="8" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="274" y="339" font-size="14" font-weight="600" fill="#111014">Column or Row</text><rect x="24" y="360" width="190" height="32" rx="8" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="40" y="381" font-size="14" font-weight="600" fill="#111014">Text layer</text><path d="M214,376 L258,376" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="258" y="360" width="290" height="32" rx="8" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="274" y="381" font-size="14" font-weight="600" fill="#111014">TextView</text><rect x="24" y="402" width="190" height="32" rx="8" fill="#fbfbfb" stroke="#c8c5d0" stroke-width="1.5"/><text x="40" y="423" font-size="14" font-weight="600" fill="#111014">Image fill</text><path d="M214,418 L258,418" fill="none" stroke="#5e5b79" stroke-width="1.5" marker-end="url(#m-line)"/><rect x="258" y="402" width="290" height="32" rx="8" fill="#f4f0ff" stroke="#6e66cc" stroke-width="1.5"/><text x="274" y="423" font-size="14" font-weight="600" fill="#111014">Image and a project asset</text><rect x="588" y="286" width="348" height="166" rx="12" fill="#ffffff" stroke="#c8c5d0" stroke-width="1.5"/><text x="608" y="316" font-size="15" font-weight="700" fill="#111014">Each turn</text><circle cx="614" cy="339" r="3" fill="#483faa"/><text x="626" y="344" font-size="13.5" fill="#2f2f2f">Up to 8 screens and 16 images stored</text><circle cx="614" cy="366" r="3" fill="#483faa"/><text x="626" y="371" font-size="13.5" fill="#2f2f2f">Landscape frames are skipped when</text><text x="626" y="390" font-size="13.5" fill="#2f2f2f">the file has portrait ones</text><circle cx="614" cy="412" r="3" fill="#483faa"/><text x="626" y="417" font-size="13.5" fill="#2f2f2f">The look comes from the file,</text><text x="626" y="436" font-size="13.5" fill="#2f2f2f">not from your prompt</text></svg>
